project:
  type: website
  post-render:
    - scripts/sync-resume-pdf.sh

filters:
  - filters/page-tags.lua

website:
  site-url: https://olivia-jackson-lambert.github.io
  image: /assets/og-image.jpg
  open-graph:
    image: /assets/og-image.jpg
  twitter-card:
    card-style: summary_large_image
    image: /assets/og-image.jpg
  navbar:
    title: "Olivia Jackson Lambert"
    search: false
    left: []
    right: []
  sidebar: false

format:
  html:
    include-in-header: 
      - includes/iconify.html
      - includes/favicon.html
    include-before-body: includes/site-header.html
    theme:
      light: [default, scss/theme-light.scss]
      dark:  [default, scss/theme-dark.scss]
    highlight-style: github
    css: styles.css
    toc: true
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true