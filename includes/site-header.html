<button class="totop" type="button" aria-label="Back to top" title="Back to top" hidden>
  <iconify-icon icon="ph:arrow-up-light" aria-hidden="true"></iconify-icon>
</button>

<script>
(function () {
  function isDark() {
    return document.body.classList.contains("quarto-dark") ||
           document.documentElement.dataset.bsTheme === "dark";
  }
  function setIcon() {
    var i = document.getElementById("sitehead-theme-icon");
    if (i) i.setAttribute("icon", isDark() ? "ph:sun-light" : "ph:moon-light");
  }
  // Quarto places include-before-body inside the article column on article
  // pages. Lift the header to the top of <body> so it spans the full width.
  function liftHeader() {
    var head = document.querySelector(".sitehead");
    if (head && head.parentElement !== document.body) document.body.prepend(head);
  }
  liftHeader();
  window.addEventListener("DOMContentLoaded", function () {
    liftHeader();

    var top = document.querySelector(".totop");
    if (top) {
      if (top.parentElement !== document.body) document.body.appendChild(top);
      var onScroll = function () { top.hidden = window.scrollY < 480; };
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
      top.addEventListener("click", function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      });
    }

    var btn = document.querySelector(".sitehead-theme");
    if (!btn) return;
    setIcon();
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      if (window.quartoToggleColorScheme) {
        window.quartoToggleColorScheme();
      } else {
        var dark = isDark();
        document.body.classList.toggle("quarto-dark", !dark);
        document.body.classList.toggle("quarto-light", dark);
        document.documentElement.dataset.bsTheme = dark ? "light" : "dark";
        try { localStorage.setItem("quarto-color-scheme", dark ? "light" : "dark"); } catch (err) {}
      }
      setTimeout(setIcon, 60);
    });
  });
})();
</script>
