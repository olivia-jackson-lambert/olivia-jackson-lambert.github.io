<script>
(function () {
  function isDark() {
    return document.body.classList.contains("quarto-dark") ||
           document.documentElement.dataset.bsTheme === "dark";
  }
  function setIcon() {
    var i = document.getElementById("sitehead-theme-icon");
    if (i) i.setAttribute("icon", isDark() ? "lucide:sun" : "lucide:moon");
  }
  // Quarto places include-before-body inside the article column on article
  // pages. Lift the header to the top of <body> so it spans the full width.
  function liftHeader() {
    var head = document.querySelector(".sitehead");
    if (head && head.parentElement !== document.body) document.body.prepend(head);
  }
  liftHeader();
  window.addEventListener("DOMContentLoaded", function () {
    liftHeader();
    var btn = document.querySelector(".sitehead-theme");
    if (!btn) return;
    setIcon();
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      if (window.quartoToggleColorScheme) {
        window.quartoToggleColorScheme();
      } else {
        var dark = isDark();
        document.body.classList.toggle("quarto-dark", !dark);
        document.body.classList.toggle("quarto-light", dark);
        document.documentElement.dataset.bsTheme = dark ? "light" : "dark";
        try { localStorage.setItem("quarto-color-scheme", dark ? "light" : "dark"); } catch (err) {}
      }
      setTimeout(setIcon, 60);
    });
  });
})();
</script>
