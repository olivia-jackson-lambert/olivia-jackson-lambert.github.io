<script>
(function () {
  function isDark() {
    return document.body.classList.contains("quarto-dark") ||
           document.documentElement.dataset.bsTheme === "dark";
  }
  function setIcon() {
    var i = document.getElementById("sitehead-theme-icon");
    if (i) i.setAttribute("icon", isDark() ? "ph:sun-light" : "ph:moon-light");
  }
  // Quarto places include-before-body inside the article column on article
  // pages. Lift the header to the top of <body> so it spans the full width.
  function liftHeader() {
    var head = document.querySelector(".sitehead");
    if (head && head.parentElement !== document.body) document.body.prepend(head);
  }
  liftHeader();

  // Sections fade up once as they enter the viewport. The class on <html> is what
  // hides them, so without this script (or with reduced motion) nothing is hidden.
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if ("IntersectionObserver" in window && !reduce) document.documentElement.classList.add("js-reveal");
  function reveal() {
    if (!document.documentElement.classList.contains("js-reveal")) return;
    var sel = ".op-section > .op-head, .op-tile, .op-about, .op-subhead, .op-value, .op-timeline li, .op-band > *, .cs-cover";
    var els = document.querySelectorAll(sel);
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    els.forEach(function (el) {
      el.classList.add("reveal");
      var sib = el.parentElement ? Array.prototype.indexOf.call(el.parentElement.children, el) : 0;
      if (el.matches(".op-tile, .op-timeline li")) el.style.transitionDelay = (sib % 3) * 80 + "ms";
      io.observe(el);
    });
  }

  window.addEventListener("DOMContentLoaded", function () {
    liftHeader();
    reveal();

    var top = document.querySelector(".totop");
    if (top) {
      if (top.parentElement !== document.body) document.body.appendChild(top);
      var onScroll = function () { top.hidden = window.scrollY < 480; };
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
      top.addEventListener("click", function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      });
    }

    // phone menu
    var menuBtn = document.querySelector(".sitehead-menu"), menu = document.getElementById("sitemenu");
    if (menuBtn && menu) {
      if (menu.parentElement !== document.body) document.body.appendChild(menu);
      var close = menu.querySelector(".sitemenu-close");
      var setOpen = function (open) {
        menu.hidden = !open; menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
        document.body.classList.toggle("menu-open", open);
        if (open) close.focus(); else menuBtn.focus();
      };
      menuBtn.addEventListener("click", function () { setOpen(true); });
      close.addEventListener("click", function () { setOpen(false); });
      menu.addEventListener("click", function (e) { if (e.target.closest("a")) setOpen(false); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !menu.hidden) setOpen(false); });
    }

    // copy the email address (falls back to selecting it)
    document.querySelectorAll(".op-copy").forEach(function (b) {
      b.addEventListener("click", function () {
        var label = b.querySelector(".op-copy-label");
        var done = function () {
          b.classList.add("is-copied"); if (label) label.textContent = "Copied";
          setTimeout(function () { b.classList.remove("is-copied"); if (label) label.textContent = "Copy"; }, 1800);
        };
        if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(done, function () {});
      });
    });

    // reading progress on case studies and essays
    var doc = document.getElementById("quarto-document-content");
    if (doc && !document.body.classList.contains("home") && !document.body.classList.contains("resume")) {
      var bar = document.createElement("div"); bar.className = "readbar"; bar.setAttribute("aria-hidden", "true");
      document.body.appendChild(bar);
      var tick = false;
      var update = function () {
        tick = false;
        var r = doc.getBoundingClientRect(), total = r.height - window.innerHeight;
        var p = total > 0 ? Math.min(1, Math.max(0, -r.top / total)) : 1;
        bar.style.transform = "scaleX(" + p + ")";
      };
      window.addEventListener("scroll", function () { if (!tick) { tick = true; requestAnimationFrame(update); } }, { passive: true });
      window.addEventListener("resize", update); update();
    }

    var btn = document.querySelector(".sitehead-theme");
    if (!btn) return;
    setIcon();
    function toggle() {
      if (window.quartoToggleColorScheme) {
        window.quartoToggleColorScheme();
      } else {
        var dark = isDark();
        document.body.classList.toggle("quarto-dark", !dark);
        document.body.classList.toggle("quarto-light", dark);
        document.documentElement.dataset.bsTheme = dark ? "light" : "dark";
        try { localStorage.setItem("quarto-color-scheme", dark ? "light" : "dark"); } catch (err) {}
      }
      setIcon();
    }
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      // cross-fade between themes where the browser supports view transitions
      if (document.startViewTransition && !reduce) document.startViewTransition(toggle);
      else toggle();
      setTimeout(setIcon, 60);
    });
  });
})();
</script>
