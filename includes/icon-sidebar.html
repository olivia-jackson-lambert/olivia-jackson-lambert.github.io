<!-- Light/Dark mode toggle (fixed top-right) -->
<button class="theme-toggle" type="button" aria-label="Toggle light/dark mode">
  <iconify-icon id="theme-toggle-icon" icon="lucide:moon"></iconify-icon>
</button>

<script>
  (function () {
    function isDark() {
      return (
        document.body.classList.contains("quarto-dark") ||
        document.documentElement.dataset.bsTheme === "dark"
      );
    }

    function setIcon() {
      var icon = document.getElementById("theme-toggle-icon");
      if (!icon) return;
      icon.setAttribute("icon", isDark() ? "lucide:sun" : "lucide:moon");
    }

    window.addEventListener("DOMContentLoaded", function () {
      var btn = document.querySelector(".theme-toggle");
      if (!btn) return;

      setIcon();

      btn.addEventListener("click", function (e) {
        e.preventDefault();

        // Preferred: Quarto built-in toggle (works when light/dark themes are configured)
        if (window.quartoToggleColorScheme) {
          window.quartoToggleColorScheme();
        } else {
          // Fallback
          var dark = isDark();
          document.body.classList.toggle("quarto-dark", !dark);
          document.body.classList.toggle("quarto-light", dark);
          document.documentElement.dataset.bsTheme = dark ? "light" : "dark";
          try {
            localStorage.setItem("quarto-color-scheme", dark ? "light" : "dark");
          } catch (err) {}
        }

        setTimeout(setIcon, 60);
      });
    });
  })();
</script>
